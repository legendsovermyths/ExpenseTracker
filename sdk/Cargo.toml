[package]
name = "sdk"
version = "0.1.0"
edition = "2021"

[lib]
name = "sdk"
crate-type = ["staticlib"]

[dependencies]
libc = "0.2.80"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
once_cell = "1.20.2"
chrono = "0.4"
zip = "2.6.1"
thiserror = "2.0.12"
base64 = "0.22"
visioncortex = "0.9.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
